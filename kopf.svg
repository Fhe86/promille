    <rect x="12" y="14" width="96" height="52" rx="8" fill="#eef5fd" stroke="#1b2a41" stroke-width="2.5"/>
    <text x="60" y="49" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#1d4f9a">0,5 ‰</text>
    <circle cx="36" cy="96" r="13" fill="#f26b5b" stroke="#1b2a41" stroke-width="2.5"/>
    <circle cx="84" cy="96" r="13" fill="#f6c344" stroke="#1b2a41" stroke-width="2.5"/>
  </g>
  <text x="266" y="62" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#f26b5b">?</text>
</svg>
