<style>
:root{--ink:#1b2a41;--blau:#2f7fd6;--dunkel:#1d4f9a;--hell:#e3effc;--gelb:#f6c344;--korall:#f26b5b;--gruen:#2e9d62;--gruenhell:#e2f5ea;--rothell:#fdecea;--muted:#5a6a80;--creme:#fbf8f1;--orange:#f08a1c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:Verdana,Arial,Helvetica,sans-serif;font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--creme);border-bottom:2px solid var(--ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:19px;white-space:nowrap}
.prog{flex:1 1 180px;min-width:140px}
.proglab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.progbar{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--blau);width:0;transition:width .3s}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.tb button{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 14px;min-height:44px;font-size:15px;font-weight:bold}
main{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:22px;align-items:start}
.ill{border:2px solid var(--ink);border-radius:18px;background:var(--hell);padding:10px;position:sticky;top:90px}
.ill svg{display:block;width:100%;height:auto}
.kick{display:inline-block;font-size:12px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--dunkel);color:var(--dunkel);border-radius:999px;padding:2px 12px;background:#fff}
.kick.zus{border-color:var(--orange);color:#a85a00;background:#fff6e8}
h1{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:clamp(24px,4vw,34px);line-height:1.1;margin:12px 0 10px}
h2{font-size:20px;margin:18px 0 6px}
p{margin:8px 0}
.text{font-size:19px}
.frage{font-weight:bold;font-size:20px;margin:14px 0 8px}
.hinweisrechnen{font-size:15px;color:var(--muted);margin:2px 0 10px}
.in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.in span{min-width:70px;font-weight:bold}
.in input{width:190px;max-width:100%;min-height:54px;font-size:24px;padding:6px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;text-align:right}
.in input.ok{border-color:var(--gruen);background:var(--gruenhell)}
.in input.bad{border-color:var(--korall);background:var(--rothell)}
.in b{font-size:22px;min-width:40px}
.btn{border:3px solid var(--ink);background:var(--dunkel);color:#fff;border-radius:14px;padding:10px 22px;min-height:54px;font-size:19px;font-weight:bold}
.btn:active{transform:translateY(2px)}
.btn.zweit{background:#fff;color:var(--ink)}
.btn.klein{min-height:46px;font-size:16px;padding:6px 16px}
.btn.gelb{background:var(--gelb);color:var(--ink)}
.btn:disabled{opacity:.45}
.reihe{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;align-items:center}
.ent{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.ent button{border:3px solid var(--ink);background:#fff;border-radius:16px;min-height:72px;font-size:19px;font-weight:bold;padding:8px 12px}
.ent button.gewaehlt{background:var(--gruenhell);border-color:var(--gruen)}
.ent button.falsch{background:var(--rothell);border-color:var(--korall)}
.ent button:disabled{opacity:.7}
.mc{display:grid;gap:12px;margin:10px 0}
.mc button{border:3px solid var(--ink);background:#fff;border-radius:16px;min-height:72px;font-size:18px;text-align:left;padding:10px 16px}

.kreuz td.teil{background:#d6e8fb;border-color:var(--blau)}

.weg{font-family:"Courier New",monospace;background:var(--hell);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px;line-height:1.7}

.regel .w{font-family:"Arial Black",Arial,sans-serif;font-size:24px;color:var(--dunkel);text-align:center;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(27,42,65,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow:auto}
.overlay[hidden]{display:none}
.dialog{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px;max-width:640px;width:100%}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:10px;margin:12px 0}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 66px;border:2.5px solid var(--ink);border-radius:16px;min-height:60px;display:flex;align-items:center}
.steps li::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--blau);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:21px}
.ue{font-size:20px;font-weight:bold;text-align:center;border:3px dashed var(--korall);border-radius:16px;padding:12px;margin:14px 0;background:#fff7f5}
.card.start{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.namefeld{width:100%;max-width:340px;min-height:54px;font-size:22px;padding:6px 14px;border:3px solid var(--ink);border-radius:14px}
.urkunde{display:block}
.urkunde .card{display:block}
.titelbox{text-align:center;border:3px solid var(--ink);border-radius:20px;background:#fff8e1;padding:16px;margin:12px 0}
.titelbox .t{font-family:"Arial Black",Arial,sans-serif;font-size:30px;color:var(--dunkel)}
table.prot{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
table.prot th,table.prot td{border:1.5px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top}
table.prot th{background:var(--hell)}
.schluss{text-align:center;font-weight:bold;font-size:20px;margin:16px 0}
.klein{font-size:13px;color:var(--muted)}
@media (max-width:900px){.card,.card.start{grid-template-columns:1fr}.ill{position:static;max-width:340px;margin:0 auto}.regel{grid-template-columns:100px 1fr}}
@media (max-width:560px){.ent{grid-template-columns:1fr}.in input{width:150px}}
@media (prefers-reduced-motion:reduce){.progbar i{transition:none}}
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.noprint,.overlay{display:none!important}
  main{max-width:none;padding:0}
  .card{border:none;padding:0}
  table.prot{font-size:10.5pt}
  .titelbox{break-inside:avoid}
}
</style>

var FARBEN = {f1:'#2f7fd6', f2:'#f26b5b', f3:'#f6c344', f4:'#2e9d62', f5:'#8a63d2', f6:'#e38a2f'};
function illu(s){
  if (s.kind==='fahrer') return svgAuto(FARBEN[s.d.id]||BL);
  if (s.kind==='anw') return s.d.id==='a1' ? svgHaus() : s.d.id==='a2' ? svgLoeffel() : svgBahn();
  if (s.kind==='aha') return svgFlasche('5 % vol.');
  return svgTester('0,41 ‰');
}

/* ---------- Kreuz-Formel und Rechenweg ---------- */
function werte(a){
  var G,P,p;
  if (a.typ==='promillesatz'){ G=a.grundwert; P=a.promillewert; p=null; }
  else if (a.typ==='promillewert'){ G=a.grundwert; p=a.promillesatz_pm; P=null; }
  else { P=a.promillewert; p=a.promillesatz_pm; G=null; }
  return {G:G,P:P,p:p};
}
function kreuz(a){
  var w=werte(a), u=unit(a), t=a.typ;
  function zelle(txt,cls,lab){ return '<td class="'+cls+'">'+txt+'<small>'+lab+'</small></td>'; }
  function gesucht(lab){ return '<td class="gesucht">?<small>'+lab+'</small></td>'; }
  var c1, cG, cp, cP;
  if (t==='promillewert') { c1=zelle('1000 ‰','teil','das Ganze'); cG=zelle(fmt(w.G)+' '+u,'mal','Grundwert'); cp=zelle(fmt(w.p)+' ‰','mal','Promillesatz'); cP=gesucht('Promillewert'); }
  else if (t==='promillesatz') { c1=zelle('1000 ‰','mal','das Ganze'); cG=zelle(fmt(w.G)+' '+u,'teil','Grundwert'); cp=gesucht('Promillesatz'); cP=zelle(fmt(w.P)+' '+u,'mal','Promillewert'); }
  else { c1=zelle('1000 ‰','mal','das Ganze'); cG=gesucht('Grundwert'); cp=zelle(fmt(w.p)+' ‰','teil','Promillesatz'); cP=zelle(fmt(w.P)+' '+u,'mal','Promillewert'); }
  return tab(c1,cG,cp,cP);
}
function tab(c1,c2,c3,c4){
  return '<table class="kreuz"><tr><th>Promille</th><th>Einheit</th></tr><tr>'+c1+c2+'</tr><tr>'+c3+c4+'</tr></table>'
   +'<div class="legende">Orange mal nehmen, blau teilen, gelb ist gesucht.</div>';
}
function weg(a){
  var w=werte(a), u=unit(a), L=a.loesung;
  if (a.typ==='promillesatz') return 'Promillesatz = Promillewert : Grundwert · 1000<br>= '+fmt(w.P)+' '+u+' : '+fmt(w.G)+' '+u+' · 1000<br>= '+fmt(L)+' ‰';
  if (a.typ==='promillewert') return 'Promillewert = Grundwert · Promillesatz : 1000<br>= '+fmt(w.G)+' '+u+' · '+fmt(w.p)+' : 1000<br>= '+fmt(L)+' '+u;
  return 'Grundwert = Promillewert · 1000 : Promillesatz<br>= '+fmt(w.P)+' '+u+' · 1000 : '+fmt(w.p)+'<br>= '+fmt(L)+' '+u;
}
function widmark(pe){
  return 'Alkohol in Gramm: '+fmt(D.profi.alkohol_ml)+' ml · 0,8 = '+fmt(D.profi.alkohol_g)+' g<br>'
   +'Promille = Gramm : (Körpergewicht · r)<br>'
   +pe.name+': '+fmt(D.profi.alkohol_g)+' : ('+fmt(pe.kg)+' · '+fmt(pe.r)+')';
}

/* ---------- Rendern ---------- */
function setProg(){
  var n = I<0 ? 0 : Math.min(I,N);
  document.getElementById('bar').style.width = (n/N*100)+'%';
  document.getElementById('proglab').textContent = I<0 ? 'Start' : (I>=N ? 'Geschafft' : 'Station '+(I+1)+' von '+N);
  var pts = ST.res.reduce(function(a,r){return a+r.pts;},0);
  document.getElementById('pts').textContent = 'Punkte: '+pts;
}
function render(){
  readInputs();
  setProg();
  if (I<0) main.innerHTML = renderStart();
  else if (I>=N) main.innerHTML = renderEnde();
  else main.innerHTML = renderStation();
  var f = document.getElementById('zahl') || document.getElementById('zahlM');
  if (f && C && !C.zahlOk && C.eingabe==='' && !C.msg) { /* kein Autofokus auf iPad, damit die Tastatur nicht stoert */ }
}
function neuRender(){ main.innerHTML=''; render(); window.scrollTo(0,0); }
function readInputs(){
  if (!C) return;
  var e=document.getElementById('zahl'); if (e) C.eingabe=e.value;
  var m=document.getElementById('zahlM'); if (m) C.e1=m.value;

function stationKopf(s){
  var kick = s.kind==='fahrer' ? 'Kontrolle '+s.nr+' von '+D.fahrer.length
    : s.kind==='anw' ? 'Promille steckt überall'
    : s.kind==='aha' ? 'Moment mal' : 'Zusatz &middot; Bonuspunkte';
  var titel = s.kind==='fahrer' ? s.d.name+' ('+s.d.alter+')' : s.kind==='anw' ? s.d.titel : s.kind==='aha' ? 'Stimmt das Blut-Modell?' : 'Profi-Kontrolle';
  return '<span class="kick'+(s.bonus?' zus':'')+'">'+kick+'</span><h1>'+esc(titel)+'</h1>';
}

  if (!C.msg) return '';
  return '<div class="fb '+C.msg.t+'" role="status" aria-live="polite">'+C.msg.h+'</div>';
}
function hilfeHtml(a){
  var h='';
  if (C.hilfe>=1) h+='<h2>Hinweis 1: Kreuz-Formel</h2>'+kreuz(a);
  if (C.hilfe>=2) h+='<h2>Hinweis 2: Rechenweg</h2><div class="weg">'+weg(a)+'</div>';

function renderStation(){
  var s = stations[I]; if (!C) C = newC();
  var a = s.d, h = '<section class="card"><div class="ill">'+illu(s)+'</div><div>'+stationKopf(s);
  if (s.kind==='fahrer' || s.kind==='anw') h += renderRechnen(s);
  else if (s.kind==='aha') h += renderAha(s);
  else h += renderProfi(s);
  h += '</div></section>';
  return h;
}

  var a=s.d, h='<p class="text">'+esc(a.text)+'</p>';
  h+='<p class="frage">'+esc(a.frage)+'</p><p class="hinweisrechnen">Rechne im Heft oder in OneNote. Hier tippst du nur das Ergebnis ein.</p>';
  var st = C.zahlOk ? 'ok' : (C.msg && C.msg.t==='bad' && !C.entStep ? 'bad' : '');
  h+='<label class="in"><span>Ergebnis</span><input id="zahl" type="text" inputmode="decimal" autocomplete="off" value="'+esc(C.zahlOk ? fmt(a.loesung) : C.eingabe)+'" class="'+st+'"'+(C.zahlOk?' readonly':'')+'><b>'+esc(a.einheit)+'</b></label>';
  if (!C.zahlOk) h+='<div class="reihe"><button class="btn" data-act="pruefen">Prüfen</button>'+buttonsPruef()+'</div>';
  if (C.zahlOk && s.kind==='fahrer'){
    h+='<p class="frage">Und jetzt die Entscheidung:</p><div class="ent">';
    D.entscheidungen.forEach(function(e){
      var cls = C.entOk && e.id===a.entscheidung ? 'gewaehlt' : (C.falsch[e.id] ? 'falsch' : '');
      h+='<button class="'+cls+'" data-act="ent" data-id="'+e.id+'"'+(C.fertig?' disabled':'')+'>'+esc(e.label)+'</button>';

function renderProfi(s){
  var a=s.d, h='<p class="text">'+esc(a.text)+'</p>';
  h+='<div class="modell">Schätzwert, kein Test für Fahrtüchtigkeit. Das ist eine Rechnung auf dem Papier und sagt nichts darüber, ob jemand noch fahren kann.</div>';
  var m=a.personen[0], f=a.personen[1];
  function fld(id,pe,val,st){ return '<label class="in"><span>'+esc(pe.name)+'</span><input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(val)+'" class="'+st+'"'+(C.zahlOk?' readonly':'')+'><b>‰</b></label><div class="klein" style="margin:-4px 0 6px 0">'+pe.kg+' kg, r = '+fmt(pe.r)+'</div>'; }
  var sm = C.zahlOk ? 'ok' : (C.pruefen ? (C.pruefen.m?'ok':'bad') : ''), sf = C.zahlOk ? 'ok' : (C.pruefen ? (C.pruefen.f?'ok':'bad') : '');

  h+=fld('zahlM',m,C.zahlOk?fmt(m.loesung):C.e1,sm)+fld('zahlF',f,C.zahlOk?fmt(f.loesung):C.e2,sf);

    h+='<div class="reihe"><button class="btn" data-act="pruefenP">Prüfen</button>'
      +'<button class="btn zweit klein" data-act="hinweis"'+(C.hilfe>=2?' disabled':'')+'>'+(C.hilfe===0?'Hinweis':C.hilfe===1?'Noch ein Hinweis':'Keine Hinweise mehr')+'</button>'

      +'<button class="btn zweit klein" data-act="skip">Zusatz überspringen</button></div>';

function titelFuer(p){
  if (p>=18) return 'Kontrollchef';
  if (p>=12) return 'Kontrollprofi';
  if (p>=6) return 'Kontrolleur';
  return 'Kontroll-Azubi';
}
function renderEnde(){
  var pts=0, bonus=0, maxKern=0;
  stations.forEach(function(s,i){ var r=ST.res[i]; if(!r) return; if (s.bonus) bonus+=r.pts; else pts+=r.pts; });
  stations.forEach(function(s){ if(!s.bonus) maxKern+=2; });
  var ges=pts+bonus;
  var rows='';
  stations.forEach(function(s,i){
    var r=ST.res[i]||{pts:0,erster:false,hilfe:false,gezeigt:false,skipped:true};
    var erg = r.skipped ? 'übersprungen' : (r.gezeigt ? 'Lösung angesehen: ' : '')+ergebnisText(s);
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(bezeichnung(s))+(s.bonus?' (Zusatz)':'')+'</td><td>'+esc(erg)+'</td><td>'+(r.skipped?'-':(r.erster?'ja':'nein'))+'</td><td>'+(r.skipped?'-':(r.hilfe?'ja':'nein'))+'</td><td>'+r.pts+'</td></tr>';
  });
  var d=new Date().toLocaleDateString('de-DE');
  var h='<section class="urkunde"><div class="card protokoll"><div>'
   +'<span class="kick">Kontrollprotokoll &middot; Mathe Klasse 8</span><h1>Führerschein-Urkunde</h1>'
   +'<p class="text">für <b>'+esc(ST.name)+'</b>, ausgestellt am '+d+'</p>'
   +'<div class="titelbox"><div class="klein">Du bist</div><div class="t">'+titelFuer(ges)+'</div><div>'+pts+' von '+maxKern+' Punkten'+(bonus?' und '+bonus+(bonus===1?' Bonuspunkt':' Bonuspunkte'):'')+'</div></div>'
   +'<table class="prot"><tr><th>Nr.</th><th>Station</th><th>Ergebnis</th><th>Erster Versuch</th><th>Hilfe</th><th>Punkte</th></tr>'+rows+'</table>'
   +'<p class="klein">Das Blut-Modell ist ein Rechenmodell. Schätzwerte sind kein Test für Fahrtüchtigkeit.</p>'
   +'<p class="schluss">Nicht trinken und fahren.</p>'
   +'</div></div>'
   +'<div class="card noprint" style="margin-top:18px;display:block"><h2 style="margin-top:0">Jetzt ablegen: ein PDF aus deinem Protokoll</h2>'
   +'<div class="reihe"><button class="btn" data-act="pdf">PDF sichern</button><button class="btn zweit" data-act="neu">Noch einmal spielen</button></div>'
   +anleitungHtml()+'</div></section>';
  return h;
}

function closeOverlay(){ overlay.hidden=true; overlay.innerHTML=''; }
function regelnHtml(){
  var h='<h1 style="margin-top:0">Regelkarte</h1><div class="regeln">';
  D.regeln.forEach(function(r){ h+='<div class="regel"><div class="w">'+esc(r.wert)+' ‰</div><div>'+esc(r.text)+'</div></div>'; });
  h+='</div><p class="klein">Stand Oktober 2026. Quellen: § 24a StVG, Kraftfahrt-Bundesamt, ADAC.</p><div class="reihe"><button class="btn" data-act="zu">Schließen</button></div>';
  return h;
}

/* ---------- Aktionen ---------- */
function fertig(pts, extra){
  C.fertig=true;
  var s=stations[I];
  var r = {id:s.d.id, pts:pts, erster:(C.fehler===0&&C.hilfe===0&&!C.gezeigt), hilfe:C.hilfe>0, gezeigt:C.gezeigt, skipped:!!(extra&&extra.skipped)};
  ST.res[I]=r; save();
}
function punkte(){ return C.gezeigt ? 0 : ((C.fehler===0 && C.hilfe===0) ? 2 : 1); }
function falschMsg(v, a){
  C.fehler++;
  var t = 'Noch nicht ganz. Rechne im Heft noch einmal nach.';
  if (isFinite(v) && a){
    if (nahe(v, a.loesung/10) && a.typ==='promillesatz') t='Das wäre die Prozentzahl. Gesucht ist der Wert in Promille. Das Komma wandert um 3 Stellen, nicht um 2.';
    else if (nahe(v, a.loesung/1000) && a.typ==='promillesatz') t='Das ist die Dezimalzahl. Gefragt ist der Promillesatz in ‰.';
    else if (nahe(v, a.loesung*10) || nahe(v, a.loesung/10)) t='Schau noch einmal auf das Komma. Bei Promille wird durch 1000 geteilt, nicht durch 100.';
    else if (C.fehler>=2) t='Fast. Nimm den Hinweis, er zeigt dir die Kreuz-Formel.';
  }
  if (C.fehler>=3) t+=' Du darfst dir jetzt die Lösung ansehen. Dann gibt es für diese Karte keine Punkte.';
  C.msg={t:'bad',h:'<b class="t">'+esc(t)+'</b>'};
}
var A = {
  start:function(){
    var v=(document.getElementById('name').value||'').trim();
    if (v.length<2){ document.getElementById('nm').textContent='Bitte trage deinen Namen ein.'; return; }
    ST.name=v; ST.res=[]; save(); I=0; C=newC(); neuRender();
  },
  regeln:function(){ showOverlay(regelnHtml()); },
  anleitung:function(){ showOverlay('<h1 style="margin-top:0">Ablegen in OneNote</h1>'+anleitungHtml()+'<div class="reihe"><button class="btn" data-act="zu">Schließen</button></div>'); },
  neu:function(){ showOverlay('<h1 style="margin-top:0">Neu starten?</h1><p class="text">Dein Fortschritt und dein Protokoll werden gelöscht. Das lässt sich nicht rückgängig machen.</p><div class="reihe"><button class="btn" data-act="neuJa">Ja, neu starten</button><button class="btn zweit" data-act="zu">Nein, weiterspielen</button></div>'); },
  neuJa:function(){ ST={name:'',res:[]}; save(); I=-1; C=null; closeOverlay(); neuRender(); },
  zu:closeOverlay,
  pruefen:function(){
    var s=stations[I], a=s.d, v=parseNum(document.getElementById('zahl').value);
    C.eingabe=document.getElementById('zahl').value;
    if (isNaN(v)){ C.msg={t:'info',h:'<b class="t">Bitte tippe eine Zahl ein, zum Beispiel 0,25.</b>'}; render(); return; }
    if (nahe(v,a.loesung)){
      C.zahlOk=true; C.eingabe='';
      if (s.kind==='anw'){ C.msg={t:'ok',h:'<b class="t">Richtig!</b>'+esc(fmt(a.loesung)+' '+a.einheit)+' ist das Ergebnis.'}; fertig(punkte()); }
      else C.msg={t:'ok',h:'<b class="t">Richtig: '+esc(fmt(a.loesung))+' '+esc(a.einheit)+'.</b>Jetzt zur Entscheidung.'};
    } else falschMsg(v,a);
    render();
  },
  ent:function(el){
    var s=stations[I], a=s.d, id=el.getAttribute('data-id');
    if (id===a.entscheidung){
      C.entOk=true;
      C.msg={t:'ok',h:'<b class="t">Richtig: '+esc(entLabel(id))+'.</b>'+esc(a.grund)};
      fertig(punkte());
    } else {
      C.falsch[id]=true; C.fehler++;
      var t='Das passt nicht. Lies die Regelkarte noch einmal und achte auf Alter und Probezeit.';
      if (C.fehler>=3) t+=' Du darfst dir jetzt die Lösung ansehen. Dann gibt es für diese Karte keine Punkte.';
      C.msg={t:'bad',h:'<b class="t">'+esc(t)+'</b>'};
    }
    render();
  },
  hinweis:function(){ if (C.hilfe<2) C.hilfe++; render(); },
  loesung:function(){
    var s=stations[I], a=s.d;
    C.gezeigt=true; C.zahlOk=true; C.entOk=true; C.mcOk=true; C.hilfe=2;
    if (s.kind==='fahrer') C.msg={t:'info',h:'<b class="t">Lösung: '+esc(fmt(a.loesung))+' '+esc(a.einheit)+', '+esc(entLabel(a.entscheidung))+'.</b>'+esc(a.grund)};
    else if (s.kind==='anw') C.msg={t:'info',h:'<b class="t">Lösung: '+esc(fmt(a.loesung))+' '+esc(a.einheit)+'.</b>'};
    else if (s.kind==='aha') C.msg={t:'info',h:'<b class="t">Lösung: Antwort A.</b>'};
    else C.msg={t:'info',h:'<b class="t">Lösung: '+a.personen.map(function(p){return esc(p.name)+' '+esc(fmt(p.loesung))+' ‰';}).join(', ')+'. Die Frau hat den höheren Wert.</b>'};
    fertig(0); render();
  },
  mc:function(el){
    var a=stations[I].d, id=el.getAttribute('data-id'), o=null;
    a.optionen.forEach(function(x){ if (x.id===id) o=x; });
    if (o.richtig){ C.mcOk=true; C.msg={t:'ok',h:'<b class="t">Richtig!</b>'}; fertig(punkte()); }
    else { C.falsch[id]=true; C.fehler++; C.msg={t:'bad',h:'<b class="t">Noch nicht. Überlege: Wo im Körper bleibt der Alkohol, und was macht die Leber?</b>'}; }
    render();
  },
  pruefenP:function(){
    var a=stations[I].d, m=parseNum(document.getElementById('zahlM').value), f=parseNum(document.getElementById('zahlF').value);
    C.e1=document.getElementById('zahlM').value; C.e2=document.getElementById('zahlF').value;
    if (isNaN(m)||isNaN(f)){ C.msg={t:'info',h:'<b class="t">Bitte fülle beide Felder mit einer Zahl aus.</b>'}; render(); return; }
    var okm=Math.abs(m-a.personen[0].loesung)<=0.0051, okf=Math.abs(f-a.personen[1].loesung)<=0.0051;
    C.pruefen={m:okm,f:okf};
    if (okm&&okf){ C.zahlOk=true; C.pruefen=null; C.msg={t:'ok',h:'<b class="t">Beide Werte stimmen.</b>Jetzt die Vergleichsfrage.'}; }
    else { C.fehler++; C.msg={t:'bad',h:'<b class="t">'+(okm||okf?'Einer der beiden Werte stimmt schon.':'Noch nicht ganz.')+' Rechne im Heft noch einmal: erst Gramm Alkohol, dann durch (Gewicht mal r).</b>'}; }
    render();
  },
  mcP:function(el){
    var id=el.getAttribute('data-id'), ok=el.getAttribute('data-ok')==='1';
    if (ok){ C.mcOk=true; C.msg={t:'ok',h:'<b class="t">Richtig!</b>'}; fertig(punkte()); }
    else { C.falsch[id]=true; C.fehler++; C.msg={t:'bad',h:'<b class="t">Noch nicht. Vergleiche Gewicht und r der beiden.</b>'}; }
    render();
  },
  skip:function(){ C.gezeigt=false; fertig(0,{skipped:true}); I++; C=newC(); neuRender(); },
  weiter:function(){ I++; C=newC(); neuRender(); },
  pdf:function(){ window.print(); }
};
document.addEventListener('click',function(e){
  var el=e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) { if (e.target===overlay) closeOverlay(); return; }
  var f=A[el.getAttribute('data-act')]; if (f) f(el);
});
document.addEventListener('keydown',function(e){
  if (e.key==='Enter'){
    var t=e.target;
    if (t && t.id==='name') A.start();
    else if (t && t.id==='zahl') A.pruefen();
    else if (t && (t.id==='zahlM'||t.id==='zahlF')) A.pruefenP();
  }
  if (e.key==='Escape') closeOverlay();
});
if (I>=0 && I<N) C=newC();
render();
})();
</script>
</body>
</html>
